name: Application build validation
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "server.ts"
      - "api/**"
      - "shared/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/application-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - "server.ts"
      - "api/**"
      - "shared/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/application-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production Vite build
        run: npm run build
