name: Python SDK service validation
on:
  push:
    branches: [main]
    paths:
      - "python-backend/**"
      - ".github/workflows/python-sdk-service.yml"
  pull_request:
    paths:
      - "python-backend/**"
      - ".github/workflows/python-sdk-service.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python service dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r python-backend/requirements.txt
      - name: Compile Python service
        run: python -m py_compile python-backend/main.py python-backend/setup_totp.py
