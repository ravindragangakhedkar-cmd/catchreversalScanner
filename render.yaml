services:
  - type: web
    name: catch-reversals-nubra-python
    runtime: python
    plan: free
    rootDir: python-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SERVICE_API_KEY
        generateValue: true
